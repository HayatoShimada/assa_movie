[project]
name = "kirinuki-studio"
version = "0.11.1"
description = "対談動画からローカルで文字起こし・話者分離・切り抜きを作る (CUDA / ROCm 両対応)"
readme = "README.md"
authors = [
    { name = "HayatoShimada", email = "hayato.shimada.ze@nachi.com" }
]
requires-python = ">=3.12"
# 配布物に入る依存。torchを必要とするものはここに置かない
# (torchだけで11.5GB。torch無しの構成は約0.8GB。docs/V1_PLAN.md M28)
dependencies = [
    # ASR(CUDA/CPU)。CTranslate2製でtorchを必要としない。
    # ROCmではwhisper.cpp(外部ビルド・同じくtorch不要)が最速
    "faster-whisper>=1.1.0",
    # 顔検出(M14の縦型レイアウト)とフレーム抽出。ffmpeg同梱のheadless版。
    # OpenCV 5はCascadeClassifierと同梱Haarカスケードxmlが削除されているため4系固定
    "opencv-python-headless>=4.10,<5",
    # 話者分離の既定エンジン。ONNX Runtimeで動くのでtorch不要・HFトークン不要。
    # 実測でpyannote(torch/GPU)の約4倍速く、話者割り当ての一致率94.8%
    # (docs/V1_PLAN.md M23)。モデルは ./dev.sh diarize-models で取得する
    "sherpa-onnx==1.13.4",
    # 本体(libonnxruntime等)。sherpa-onnxのwheelは依存として宣言しているが
    # sdistのメタデータには入っておらず、uvはsdist側を読むためロックに載らない。
    # 明示しないと `uv sync` が黙って削除し、話者分離が
    # 「libonnxruntime.so が無い」で落ちる。バージョンは本体と一致必須
    "sherpa-onnx-core==1.13.4",
    # Ollama APIを叩くのに使用
    "requests>=2.31",
    # ライセンスキーのEd25519署名検証(オフライン)。
    # 自前実装は避ける。検証だけとはいえ、監査された実装を使う
    "cryptography>=43",
    # バックエンドAPI
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "anthropic>=0.121.0",
]

# 開発用の依存(配布物には入らない)。
# torchは2026-08-10に完全に外した: ASRはwhisper.cpp(GPU)とfaster-whisper(CPU)、
# 話者分離はsherpa-onnx、ピッチ推定は自前numpy実装で、どれもtorchを使わない。
# これで開発環境と配布物の構成が一致する(以前は開発機だけ14GBだった)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# 依存グループはdevだけ。GPUベンダーごとの切り替えはもう要らない
# (実行構成は backend/core/hwprofile.py の対応表が決める)
default-groups = ["dev"]
