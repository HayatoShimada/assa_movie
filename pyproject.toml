[project]
name = "kirinuki-studio"
version = "0.4.0"
description = "対談動画からローカルで文字起こし・話者分離・切り抜きを作る (CUDA / ROCm 両対応)"
readme = "README.md"
authors = [
    { name = "HayatoShimada", email = "hayato.shimada.ze@nachi.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1.0",
    # ROCm環境用のASRエンジン。CTranslate2(faster-whisper)はCUDA専用ビルドのため
    # AMD GPUでは使えず、PyTorchで動くWhisper実装に切り替える
    "transformers>=4.44",
    # 公式Whisper。単語確率とinitial_promptが取れるのでROCmでも機能が揃う。
    # 依存のtritonはNVIDIA版でpytorch-triton-rocmと同じモジュール名を奪うため、
    # tool.uv.overrides で除外している(ROCm版が既に triton を提供する)
    "openai-whisper>=20240930",
    # 顔検出(M14の縦型レイアウト)とフレーム抽出。ffmpeg同梱のheadless版。
    # OpenCV 5はCascadeClassifierと同梱Haarカスケードxmlが削除されているため4系固定
    "opencv-python-headless>=4.10,<5",
    # 話者分離の既定エンジン。ONNX Runtimeで動くのでtorch不要・HFトークン不要。
    # 実測でpyannote(torch/GPU)の約4倍速く、話者割り当ての一致率94.8%
    # (docs/V1_PLAN.md M23)。モデルは ./dev.sh diarize-models で取得する
    "sherpa-onnx==1.13.4",
    # 本体(libonnxruntime等)。sherpa-onnxのwheelは依存として宣言しているが
    # sdistのメタデータには入っておらず、uvはsdist側を読むためロックに載らない。
    # 明示しないと `uv sync` が黙って削除し、話者分離が
    # 「libonnxruntime.so が無い」で落ちる。バージョンは本体と一致必須
    "sherpa-onnx-core==1.13.4",
    # 4.x系は同意済みでないpyannote/speaker-diarization-community-1を要求するため3.x系に固定
    "pyannote-audio>=3.3,<4",
    # pyannote-audio 3.x はhuggingface_hub 1.0で削除されたuse_auth_token引数を使うため0.x系に固定
    "huggingface-hub<1.0",
    # resolve_pronouns.py がOllama APIを叩くのに使用
    "requests>=2.31",
    # ライセンスキーのEd25519署名検証(オフライン)。
    # 自前実装は避ける。検証だけとはいえ、監査された実装を使う
    "cryptography>=43",
    # バックエンドAPI
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "anthropic>=0.121.0",
]

# torch/torchaudioはGPUベンダーごとにwheelのindexが違うためグループで切り替える。
# 既定(default-groups)はrocm。NVIDIA機では:
#   uv sync --no-default-groups --group dev --group cu128
# pyannote-audio 3.x はtorchaudio 2.9以降の削除APIに依存しているため2.8系に固定
# (2.8+cu128はBlackwell/sm_120対応済み。2.8+rocm6.4はgfx1100=RX 7900系対応)
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]
cu128 = ["torch==2.8.*", "torchaudio==2.8.*"]
# pytorch-triton-rocmはtorch(rocm版)の推移依存だが、wheelがrocm indexにしか
# 無いためuvの仕様上ここに明示する必要がある
rocm = ["torch==2.8.*", "torchaudio==2.8.*", "pytorch-triton-rocm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# 開発機がROCm(RX 7900系)のため既定でrocmグループを入れる
default-groups = ["dev", "rocm"]
# openai-whisperが要求するtritonはNVIDIA版。ROCmでは pytorch-triton-rocm が
# 同名モジュールを提供済みで、二重に入れるとファイルが衝突する
override-dependencies = ["triton; sys_platform == 'no-such-platform'"]
# cu128とrocmは同時に入れられない(torchのwheelが排他)
conflicts = [[{ group = "cu128" }, { group = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-rocm", group = "rocm" },
]
torchaudio = [
    { index = "pytorch-cu128", group = "cu128" },
    { index = "pytorch-rocm", group = "rocm" },
]
# torch(rocm版)の推移依存。PyPIに3.4系が無くrocm indexにしかない
pytorch-triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true
