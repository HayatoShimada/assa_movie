# 3つのOSぶんのインストーラを作ってリリースに添付する。
#
# Mac版とWindows版はここでしか作れない。PyInstallerはクロスコンパイルできず、
# Tauriのmacos向けビルドにはXcodeが要るため、開発機(Linux)からは作れない。
# GitHubのランナーが各OSの実機なので、そこでビルドする。
#
# 手で流すとき: Actionsタブ →「リリース用インストーラ」→ Run workflow
name: リリース用インストーラ

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # リリースへの添付に必要

jobs:
  build:
    strategy:
      # 1つのOSがこけても他は作る(どのOSで失敗したか分かる方が直しやすい)
      fail-fast: false
      matrix:
        include:
          # glslc(Vulkanシェーダのコンパイラ)が22.04のリポジトリに無いため24.04。
          # 22.04で動かすにはVulkan SDKを別途入れる必要がある
          - os: ubuntu-24.04
            name: Linux
          - os: macos-14 # Apple Silicon
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linuxのビルド依存
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libvulkan-dev glslc glslang-tools spirv-headers

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Tauriの依存クレートは毎回同じ。キャッシュしないと毎回ゼロからコンパイルする
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: フロントエンドの依存
        working-directory: frontend
        run: npm ci

      - name: Pythonサイドカーを固める
        shell: bash
        run: ./scripts/build_sidecar.sh

      # whisper.cppはOSごとにバックエンドが違う。
      # macOSはMetal(Apple純正・追加の依存なし)、LinuxはVulkan。
      # WindowsはVulkan SDKの導入が要るので、まずは同梱せずに出す
      # (faster-whisperで動く。docs/verify_rocm.md の比較を参照)
      # Vulkanのシェーダ生成が重い(Linuxで実測2分半)。commitが変わるまで使い回す
      - name: whisper.cppのビルドキャッシュ
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirinuki-studio/src/whisper.cpp
          key: whispercpp-${{ matrix.os }}-${{ hashFiles('scripts/build_whispercpp.sh') }}

      - name: whisper.cppを同梱(Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build_whispercpp.sh

      # WindowsもVulkanで同梱する。AMDのWindows機はROCmが無くCTranslate2も
      # CUDA専用なので、GPUに載せる方法が実質これだけになる
      # (実行時に配るDLLは無い。vulkan-1.dllはGPUドライバが入れる)
      - name: 同梱whisper.cppのキャッシュ(Windows)
        if: matrix.os == 'windows-latest'
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/bin/whisper-cli.exe
            frontend/src-tauri/resources/licenses/whispercpp
          key: whispercpp-win-vulkan-${{ hashFiles('scripts/build_whispercpp.ps1') }}

      # ランナー同梱のcmakeとVS付属のcmake(3.31系)は whisper.cpp の configure 中に
      # 0xC0000409 でクラッシュする(実測)。新しいものを明示的に入れる
      - name: CMake(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Vulkan SDK(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" `
            -OutFile $installer -UseBasicParsing
          $root = "$env:RUNNER_TEMP\VulkanSDK"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "Vulkan SDKの導入に失敗しました" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: whisper.cppをビルドして同梱(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # WorkDirを短くするのが要点。vulkan-shaders-genが入れ子の
        # ExternalProjectを作り、MSBuildの中間ファイルのパスが260文字を超える
        run: ./scripts/build_whispercpp.ps1 -WorkDir C:\kw

      # WindowsにffmpegはOSに入っていない。同梱しないと書き出しができないうえ、
      # tauri.windows.conf.json がresourcesとして要求するのでビルド自体も通らない。
      # 配布ビルドは110MB・GPLなので、使う機能だけに絞って自前でビルドする
      - name: 同梱ffmpegのキャッシュ
        if: matrix.os == 'windows-latest'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/bin
            frontend/src-tauri/resources/licenses/ffmpeg
          key: ffmpeg-min-${{ hashFiles('scripts/build_ffmpeg.sh', 'licenses/ffmpeg-NOTICE.md', 'licenses/LGPL-2.1.txt') }}

      - name: MSYS2(ffmpegのビルド環境)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make diffutils
          pacboy: gcc:p pkgconf:p nasm:p libass:p openh264:p ffnvcodec-headers:p

      - name: ffmpegをビルドして同梱(Windows)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build_ffmpeg.sh

      # 話者分離モデル(77MB)。配布物にtorchを入れていないためpyannoteは動かず、
      # ONNXが唯一使えるエンジンになる。同梱しないと話者分離が全く使えない
      - name: 話者分離モデルのキャッシュ
        id: diarize-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/models
            frontend/src-tauri/resources/licenses/diarization
          key: diarize-models-${{ hashFiles('scripts/fetch_diarization_models.sh', 'licenses/diarization-NOTICE.md') }}

      - name: 話者分離モデルを同梱(Linux/macOS)
        if: matrix.os != 'windows-latest' && steps.diarize-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./scripts/fetch_diarization_models.sh

      - name: 話者分離モデルを同梱(Windows)
        if: matrix.os == 'windows-latest' && steps.diarize-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch_diarization_models.ps1

      - name: パッケージを作る
        working-directory: frontend
        run: npm run app:build

      # ビルドが通ることと、インストールしたアプリが起動することは別問題だった。
      # v0.9.2はインストーラが3OSぶん出来ていたのにWindows版は起動できず、
      # それに気付いたのは実機に入れてみたときだった。ここで実際に入れて確かめる
      - name: インストーラを実機で検証(Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = (Get-Item frontend/src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          ./scripts/verify_windows.ps1 -Installer $installer

      - name: 成果物を集める
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: リリースに添付(タグを打ったときだけ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
