# 3つのOSぶんのインストーラを作ってリリースに添付する。
#
# Mac版とWindows版はここでしか作れない。PyInstallerはクロスコンパイルできず、
# Tauriのmacos向けビルドにはXcodeが要るため、開発機(Linux)からは作れない。
# GitHubのランナーが各OSの実機なので、そこでビルドする。
#
# 手で流すとき: Actionsタブ →「リリース用インストーラ」→ Run workflow
name: リリース用インストーラ

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # リリースへの添付に必要

# タグを打ち直したとき、古い実行が同じリリースに書き込みにいかないようにする
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # 1つのOSがこけても他は作る(どのOSで失敗したか分かる方が直しやすい)
      fail-fast: false
      matrix:
        include:
          # glslc(Vulkanシェーダのコンパイラ)が22.04のリポジトリに無いため24.04。
          # 22.04で動かすにはVulkan SDKを別途入れる必要がある
          - os: ubuntu-24.04
            name: Linux
          - os: macos-14 # Apple Silicon
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linuxのビルド依存
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libvulkan-dev glslc glslang-tools spirv-headers

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Tauriの依存クレートは毎回同じ。キャッシュしないと毎回ゼロからコンパイルする
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: フロントエンドの依存
        working-directory: frontend
        run: npm ci

      - name: Pythonサイドカーを固める
        shell: bash
        run: ./scripts/build_sidecar.sh

      # whisper.cppはGPU機の文字起こし本体(実行環境の対応表がそう決めている)。
      # OSごとにバックエンドが違う: macOSはMetal(Apple純正・追加の依存なし)、
      # Linux/WindowsはVulkan。CPUビルドに落ちると「GPU機なのに遅い」配布物に
      # なるので、ビルドスクリプト側でVulkan必須・リンク確認を強制している
      # Vulkanのシェーダ生成が重い(Linuxで実測2分半)。commitが変わるまで使い回す
      # キャッシュ対象はソースとビルドツリー(build-bundled はSRCの下にある)。
      # 以前はスクリプトが使う場所と別のパスを指していたため一度も当たらず、
      # 「2分半かかるので使い回す」というコメントだけが残っていた
      - name: whisper.cppのビルドキャッシュ
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/whisper.cpp
          key: whispercpp-${{ matrix.os }}-${{ hashFiles('scripts/build_whispercpp.sh') }}

      - name: whisper.cppを同梱(Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          KS_WHISPERCPP_SRC: ${{ github.workspace }}/.cache/whisper.cpp
        run: ./scripts/build_whispercpp.sh

      # WindowsもVulkanで同梱する。AMDのWindows機はROCmが無くCTranslate2も
      # CUDA専用なので、GPUに載せる方法が実質これだけになる
      # (実行時に配るDLLは無い。vulkan-1.dllはGPUドライバが入れる)
      - name: 同梱whisper.cppのキャッシュ(Windows)
        if: matrix.os == 'windows-latest'
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/bin/whisper-cli.exe
            frontend/src-tauri/resources/licenses/whispercpp
          key: whispercpp-win-vulkan-${{ hashFiles('scripts/build_whispercpp.ps1') }}

      # ランナー同梱のcmakeとVS付属のcmake(3.31系)は whisper.cpp の configure 中に
      # 0xC0000409 でクラッシュする(実測)。新しいものを明示的に入れる
      - name: CMake(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Vulkan SDK(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" `
            -OutFile $installer -UseBasicParsing
          $root = "$env:RUNNER_TEMP\VulkanSDK"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "Vulkan SDKの導入に失敗しました" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: whisper.cppをビルドして同梱(Windows)
        if: matrix.os == 'windows-latest' && steps.whispercpp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        # WorkDirを短くするのが要点。vulkan-shaders-genが入れ子の
        # ExternalProjectを作り、MSBuildの中間ファイルのパスが260文字を超える
        run: ./scripts/build_whispercpp.ps1 -WorkDir C:\kw

      # WindowsにffmpegはOSに入っていない。同梱しないと書き出しができないうえ、
      # tauri.windows.conf.json がresourcesとして要求するのでビルド自体も通らない。
      # 配布ビルドは110MB・GPLなので、使う機能だけに絞って自前でビルドする
      - name: 同梱ffmpegのキャッシュ
        if: matrix.os == 'windows-latest'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          # bin/ を丸ごと対象にしない。**同じ場所に居る whisper-cli.exe を巻き込む**。
          # whisper.cppを更新しても古いバイナリで上書きされ、VERSION.txt だけ
          # 新しいという検知しようのない不整合が出荷される
          path: |
            frontend/src-tauri/resources/bin/ffmpeg.exe
            frontend/src-tauri/resources/bin/ffprobe.exe
            frontend/src-tauri/resources/licenses/ffmpeg
          key: ffmpeg-min-${{ hashFiles('scripts/build_ffmpeg.sh', 'licenses/ffmpeg-NOTICE.md', 'licenses/LGPL-2.1.txt') }}

      - name: MSYS2(ffmpegのビルド環境)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make diffutils
          pacboy: gcc:p pkgconf:p nasm:p libass:p openh264:p ffnvcodec-headers:p

      - name: ffmpegをビルドして同梱(Windows)
        if: matrix.os == 'windows-latest' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./scripts/build_ffmpeg.sh

      # macOSも同梱する。Homebrewのffmpeg 9はlibassが外されていて、
      # 「brewで入れてください」と案内しても字幕の焼き込みが必ず失敗する(実測)
      - name: 同梱ffmpegのキャッシュ(macOS)
        if: matrix.os == 'macos-14'
        id: ffmpeg-cache-mac
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/bin/ffmpeg
            frontend/src-tauri/resources/bin/ffprobe
            frontend/src-tauri/resources/licenses/ffmpeg
          key: ffmpeg-mac-${{ hashFiles('scripts/build_ffmpeg_macos.sh', 'licenses/ffmpeg-NOTICE-macos.md', 'licenses/LGPL-2.1.txt') }}

      - name: ffmpegをビルドして同梱(macOS)
        if: matrix.os == 'macos-14' && steps.ffmpeg-cache-mac.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja
          ./scripts/build_ffmpeg_macos.sh

      # 話者分離モデル(77MB)。配布物にtorchは入れていないのでpyannoteは動かず、
      # ONNXが唯一使えるエンジンになる。同梱しないと話者分離が全く使えない
      - name: 話者分離モデルのキャッシュ
        id: diarize-cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/resources/models
            frontend/src-tauri/resources/licenses/diarization
          # 取得スクリプト・URL定義・表記のどれが変わってもキャッシュを作り直す。
          # sh版だけをキーにしていた頃は、ps1を直してもWindowsが変更を無視した
          key: >-
            diarize-models-${{ hashFiles(
              'scripts/fetch_diarization_models.py',
              'backend/engines/diarize/model_sources.py',
              'licenses/diarization-NOTICE.md',
              'licenses/Apache-2.0.txt') }}

      # 3OS共通(標準ライブラリだけで動く)。sh版とps1版に分かれていた頃は、
      # 「中身は同じ」と称しつつリトライの有無などが食い違っていた
      - name: 話者分離モデルを同梱
        if: steps.diarize-cache.outputs.cache-hit != 'true'
        shell: bash
        run: uv run --no-project python scripts/fetch_diarization_models.py

      - name: パッケージを作る
        working-directory: frontend
        run: npm run app:build

      # ビルドが通ることと、インストールしたアプリが起動することは別問題だった。
      # v0.9.2はインストーラが3OSぶん出来ていたのにWindows版は起動できず、
      # それに気付いたのは実機に入れてみたときだった。ここで実際に入れて確かめる
      - name: インストーラを実機で検証(Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # ログのダウンロードにはリポジトリの管理者権限が要る。それが無いと
        # 「exit code 1」しか見えないので、NG行をアノテーションに出す
        run: |
          # 古いビルドが残っていると複数一致して壊れる(手元で踏んだ)。新しい方を採る
          $installer = (Get-Item frontend/src-tauri/target/release/bundle/nsis/*-setup.exe |
                        Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          Write-Host "検証するインストーラ: $installer"
          # 子プロセスで走らせる。`./script.ps1` だと中の `exit 1` が
          # このステップごと終わらせてしまい、下のアノテーションに届かない
          pwsh -File ./scripts/verify_windows.ps1 -Installer $installer 2>&1 |
            Tee-Object verify.log
          if ($LASTEXITCODE -ne 0) {
            $ng = (Select-String -Path verify.log -Pattern "NG" |
                   Select-Object -First 15 |
                   ForEach-Object { $_.Line.Trim() }) -join " / "
            Write-Host "::error title=Windowsの実機検証::$ng"
            exit 1
          }

      # .deb / .AppImage / .dmg は**一度もインストール・起動されずに配布されていた**。
      # ここで実際に展開して、同梱物が揃っていること・バックエンドが起動すること・
      # 同梱物をバックエンドが解決できることまで確かめる
      - name: パッケージを実機で検証(Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          for pkg in frontend/src-tauri/target/release/bundle/deb/*.deb \
                     frontend/src-tauri/target/release/bundle/appimage/*.AppImage; do
            echo "### $pkg"
            ./scripts/verify_unix.sh "$pkg" 2>&1 | tee verify.log || {
              ng=$(grep NG verify.log | head -15 | paste -sd'|' -)
              echo "::error title=Linuxの実機検証 ($(basename "$pkg"))::$ng"
              exit 1
            }
          done

      - name: パッケージを実機で検証(macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          dmg=$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          ./scripts/verify_unix.sh "$dmg" 2>&1 | tee verify.log || {
            ng=$(grep NG verify.log | head -15 | paste -sd'|' -)
            echo "::error title=macOSの実機検証::$ng"
            exit 1
          }

      # 検証が落ちても集める。落ちた成果物を手元に落として調べられないと、
      # 「CIでだけ落ちる」を潰せない(リリースへの添付は下の別ステップなので、
      # 検証が落ちていればここで集めても配布はされない)
      - name: 成果物を集める
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # CHANGELOG.md の先頭の節をそのままリリースノートにする。
      # 添付だけして本文が空だと、利用者は何が変わったのか分からない
      - name: リリースノートを取り出す
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          awk '/^## v/{ if (found) exit; found=1; next } found' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "CHANGELOG.md に節がありません" >&2
            exit 1
          fi
          head -5 RELEASE_BODY.md

      - name: リリースに添付(タグを打ったときだけ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
