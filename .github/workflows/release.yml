# 3つのOSぶんのインストーラを作ってリリースに添付する。
#
# Mac版とWindows版はここでしか作れない。PyInstallerはクロスコンパイルできず、
# Tauriのmacos向けビルドにはXcodeが要るため、開発機(Linux)からは作れない。
# GitHubのランナーが各OSの実機なので、そこでビルドする。
#
# 手で流すとき: Actionsタブ →「リリース用インストーラ」→ Run workflow
name: リリース用インストーラ

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # リリースへの添付に必要

jobs:
  build:
    strategy:
      # 1つのOSがこけても他は作る(どのOSで失敗したか分かる方が直しやすい)
      fail-fast: false
      matrix:
        include:
          # glslc(Vulkanシェーダのコンパイラ)が22.04のリポジトリに無いため24.04。
          # 22.04で動かすにはVulkan SDKを別途入れる必要がある
          - os: ubuntu-24.04
            name: Linux
          - os: macos-14 # Apple Silicon
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linuxのビルド依存
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libvulkan-dev glslc glslang-tools spirv-headers

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Tauriの依存クレートは毎回同じ。キャッシュしないと毎回ゼロからコンパイルする
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: フロントエンドの依存
        working-directory: frontend
        run: npm ci

      - name: Pythonサイドカーを固める
        shell: bash
        run: ./scripts/build_sidecar.sh

      # whisper.cppはOSごとにバックエンドが違う。
      # macOSはMetal(Apple純正・追加の依存なし)、LinuxはVulkan。
      # WindowsはVulkan SDKの導入が要るので、まずは同梱せずに出す
      # (faster-whisperで動く。docs/verify_rocm.md の比較を参照)
      # Vulkanのシェーダ生成が重い(Linuxで実測2分半)。commitが変わるまで使い回す
      - name: whisper.cppのビルドキャッシュ
        if: matrix.os != 'windows-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kirinuki-studio/src/whisper.cpp
          key: whispercpp-${{ matrix.os }}-${{ hashFiles('scripts/build_whispercpp.sh') }}

      - name: whisper.cppを同梱(Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: ./scripts/build_whispercpp.sh

      - name: パッケージを作る
        working-directory: frontend
        run: npm run app:build

      - name: 成果物を集める
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: リリースに添付(タグを打ったときだけ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
