[package]
name = "kirinuki-studio"
version = "0.9.6"
description = "対談動画からローカルで文字起こし・話者分離・切り抜きを作る"
authors = ["HayatoShimada"]
edition = "2021"
rust-version = "1.77"

[lib]
# 統合テストからバックエンド起動まわりの純粋な処理を呼べるようにする
name = "kirinuki_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 親プロセスが死んだらバックエンドも道連れにするため(prctl PR_SET_PDEATHSIG)。
# Dropだけではシグナルで殺されたときに走らず、Pythonが残ってポートを掴み続ける
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# WindowsにはPR_SET_PDEATHSIGに相当するものが無い。ジョブオブジェクトに入れて
# 親と一緒に片付ける(JobObjects)。起動に失敗したことを画面で伝えるため
# メッセージボックスも使う(WindowsAndMessaging)。
# 版はtauriが既に引いているものに合わせる(重複ビルドを避ける)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  # JOBOBJECT_EXTENDED_LIMIT_INFORMATION がこのfeatureの下にある
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 配布サイズを削る。実測(依存クレートがコンパイル済みの状態):
#   lto有り 36.6秒 / 3.2MB、lto無し 34.7秒 / 4.5MB
# 差は2秒なので残す。ビルドが遅いのはltoではなくキャッシュ不在が原因だった
# (CIは Swatinem/rust-cache で依存を使い回す)
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
